<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Monitoramento - Anhaia Mello</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; }
        #sidebar { width: 350px; padding: 20px; overflow-y: auto; background: #f8fafc; }
        #map { flex: 1; }
        .card { background: white; padding: 15px; margin-bottom: 10px; border-left: 5px solid #ef4444; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div id="sidebar">
        <h3>Relatos da Comunidade</h3>
        <div id="lista-ocorrencias">Carregando...</div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([-23.5822, -46.5844], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        function calcularTempo(dataISO) {
            if (!dataISO) return "Sem data";
            const diff = Math.floor((new Date() - new Date(dataISO)) / 60000);
            if (diff < 1) return "Agora mesmo";
            if (diff < 60) return `Há ${diff} min`;
            return `Há ${Math.floor(diff / 60)}h`;
        }

        async function carregarDados() {
            const res = await fetch('/ocorrencias/validadas');
            const pontos = await res.json();
            const lista = document.getElementById('lista-ocorrencias');
            lista.innerHTML = '';
            pontos.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<strong>Nível ${p.nivel_agua}</strong> - <small>${calcularTempo(p.created_at)}</small><br>${p.descricao}`;
                lista.appendChild(card);
            });
        }
        carregarDados();
        setInterval(carregarDados, 10000);
    </script>
</body>
</html>
